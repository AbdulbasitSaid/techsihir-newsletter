[package]
name = "techsihir-newsletter"
version = "0.1.0"
authors = ["Abdulbasit (techsihir) <abdulbasit@techsihir.com> "]
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "techsihir-newsletter"

[dependencies]
actix-web = "4.14.1"
reqwest = "0.13.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
serde = { features = ["derive"], version = "1.0.229" }
config = "0.15"
uuid = {version ="1.24.1", features = ["v4"]}
tracing = {version = "0.1.44", features = ["log"]}
tracing-subscriber = {version = "0.3.23" , features = ["registry", "env-filter"]}
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
secrecy = {version = "0.10.3" , features = ["serde"]}
tracing-actix-web = "0.7.22"

[dependencies.sqlx]
version = "~0.8.0"
default-features = false
features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
]
